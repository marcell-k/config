palette = "kanagawa_dragon"

[palettes.kanagawa_dragon]
black = "#0d0c0c"
red = "#c4746e"
green = "#8a9a7b"
yellow = "#c4b28a"
blue = "#8ba4b0"
magenta = "#a292a3"
cyan = "#8ea4a2"
gray = "#a6a69c"
br_red = "#e46876"
br_green = "#87a987"
br_yellow = "#e6c384"
br_blue = "#7fb4ca"
br_magenta = "#938aa9"
br_cyan = "#7aa89f"
white = "#c5c9c5"

[character]
success_symbol = "[➜](br_green)"
error_symbol = "[➜](br_red)"
vicmd_symbol = "[➜](br_magenta)"

[directory]
style = "br_blue"
read_only_style = "br_red"

[git_branch]
symbol = " "
style = "br_yellow"
format = "[$symbol$branch]($style) "

[git_status]
style = "br_red"

[cmd_duration]
min_time = 2000
style = "br_yellow"
format = "[  $duration]($style) "

# --- Disable ---
[package]
disabled = true

[rust]
disabled = true

[python]
disabled = true
