# ~/.config/aerospace/aerospace.toml
# AeroSpace tiling window manager config
#
# Usual workflow this is tuned for:
#   workspace 1 -> browser (single window)
#   workspace 2 -> Ghostty (single window)
#   workspace 3 -> flexible (browser / Finder / anything else)

# Config schema version. See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Normalizations AeroSpace does under the hood — leave these on
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps between windows/monitor edges (in pixels) — tweak to taste
[gaps]
inner.horizontal = 5
inner.vertical = 5
outer.left = 5
outer.bottom = 5
outer.top = 5
outer.right = 5

# Default layout when a new window opens
[mode.main.binding]

# --- Focus windows ---
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# --- Move windows ---
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# --- Resize windows ---
# alt-minus = 'resize smart -50'
# alt-equal = 'resize smart +50'

# --- Layout switching ---
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --- Toggle floating / fullscreen ---
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'

# --- Workspaces (1-9, matches zellij tab numbers) ---
shift-alt-1 = 'workspace 1'
shift-alt-2 = 'workspace 2'
shift-alt-4 = 'workspace 3'
shift-alt-5 = 'workspace 4'

# --- Move window to workspace ---
alt-shift-cmd-1 = 'move-node-to-workspace 1'
alt-shift-cmd-2 = 'move-node-to-workspace 2'
alt-shift-cmd-4 = 'move-node-to-workspace 3'
alt-shift-cmd-5 = 'move-node-to-workspace 4'

# --- Reload config ---
alt-shift-r = 'reload-config'

# --- Per-app rules ---
# Finder floats by default (file dialogs tile awkwardly otherwise)
[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.MobileSMS' # Messages
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Music'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.mail'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'net.whatsapp.WhatsApp'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Notes'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.reminders'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.iCal'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.Terminal'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.microsoft.VSCode'
run = ['layout floating']

[[on-window-detected]]
if.app-id = 'com.apple.Siri'
run = 'layout floating'

# Ghostty always opens tiled on workspace 2 (your primary terminal desktop)
# NOTE: no 'fullscreen' action here on purpose — a single tiled window in an
# otherwise-empty workspace already fills the screen. Native 'fullscreen'
# hides the menu bar and moves to its own Space, which isn't what we want.
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace 2']

# Safari -> workspace 1 (your primary browser desktop)
[[on-window-detected]]
if.app-id = 'com.apple.Safari'
run = ['layout tiling', 'move-node-to-workspace 1']

[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['layout tiling', 'move-node-to-workspace 3']

[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.apple.iBooksX'
run = ['layout floating', 'move-node-to-workspace 4']

# Workspace 3 is intentionally left unassigned/flexible — nothing auto-routes
# there; move things over manually with alt-shift-3 as needed.
