# ~/.config/aerospace/aerospace.toml
# AeroSpace tiling window manager config
#
# Usual workflow this is tuned for:
#   workspace 1 -> browser (single window)
#   workspace 2 -> Ghostty (single window)
#   workspace 3 -> flexible (browser / Finder / anything else)
#   workspace 4 -> reading (books, obsidian)
#   workspace 5 -> zed
#   workspace 6 ->
#
# Config schema version. See: https://nikitabobko.github.io/AeroSpace/guide#config-version
config-version = 2

# Start AeroSpace at login
start-at-login = true

# Normalizations AeroSpace does under the hood — leave these on
enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

# Gaps between windows/monitor edges (in pixels) — tweak to taste
[gaps]
inner.horizontal = 6
inner.vertical = 6
outer.left = 6
outer.bottom = 6
outer.top = 6
outer.right = 6

# Default layout when a new window opens
[mode.main.binding]

# --- Focus windows ---
ctrl-alt-h = 'focus left'
ctrl-alt-j = 'focus down'
ctrl-alt-k = 'focus up'
ctrl-alt-l = 'focus right'

# --- Move windows ---
ctrl-alt-shift-h = 'move left'
ctrl-alt-shift-j = 'move down'
ctrl-alt-shift-k = 'move up'
ctrl-alt-shift-l = 'move right'

# --- Resize windows ---
# alt-minus = 'resize smart -50'
# alt-equal = 'resize smart +50'

# --- Layout switching ---
alt-slash = 'layout tiles horizontal vertical'
alt-comma = 'layout accordion horizontal vertical'

# --- Toggle floating / fullscreen ---
alt-shift-space = 'layout floating tiling'
alt-f = 'fullscreen'

# --- Workspaces (1-9, matches zellij tab numbers) ---
shift-alt-1 = 'workspace 1'
shift-alt-2 = 'workspace 2'
shift-alt-4 = 'workspace 3'
shift-alt-5 = 'workspace 4'
shift-alt-6 = 'workspace 5'
shift-alt-7 = 'workspace 6'

# --- Move window to workspace ---
alt-shift-cmd-1 = 'move-node-to-workspace 1'
alt-shift-cmd-2 = 'move-node-to-workspace 2'
alt-shift-cmd-4 = 'move-node-to-workspace 3'
alt-shift-cmd-5 = 'move-node-to-workspace 4'
alt-shift-cmd-6 = 'move-node-to-workspace 5'
alt-shift-cmd-7 = 'move-node-to-workspace 6'

# --- Reload config ---
alt-shift-r = 'reload-config'

# --- Per-app rules ---
# First matching rule wins. Exceptions (tiled apps) go first;
# the catch-all at the bottom floats everything else.

# --- Tiled apps ---

# Helium -> workspace 1
[[on-window-detected]]
if.app-id = 'net.imput.helium'
run = ['layout tiling', 'move-node-to-workspace 1']

# Ghostty -> workspace 2
[[on-window-detected]]
if.app-id = 'com.mitchellh.ghostty'
run = ['layout tiling', 'move-node-to-workspace 2']

# Zed -> workspace 5
[[on-window-detected]]
if.app-id = 'dev.zed.Zed'
run = ['layout tiling', 'move-node-to-workspace 3']

# iBooks + Obsidian -> workspace 4
[[on-window-detected]]
if.app-id = 'md.obsidian'
run = ['layout floating', 'move-node-to-workspace 4']

[[on-window-detected]]
if.app-id = 'com.apple.iBooksX'
run = ['layout floating', 'move-node-to-workspace 4']

# Firefox -> workspace 5
[[on-window-detected]]
if.app-id = 'org.mozilla.firefox'
run = ['layout tiling', 'move-node-to-workspace 5']

# --- Catch-all: everything else floats (must stay LAST) ---
[[on-window-detected]]
if = 'true'
run = 'layout floating'
